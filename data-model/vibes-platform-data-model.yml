notes:
  - >-
    The dual-addressing pattern (person_key vs external_person_id) doubles the operation count on
    the Person and Subscription APIs and is the model's defining feature: Vibes is designed so the
    customer's CRM stays the system of record.
  - >-
    WalletCampaign is addressed inconsistently — {wallet_id} on campaign/item/message routes,
    {token} on template/location/selector routes. Both appear in the same published spec.
  - >-
    MDN is effectively immutable: creating a person with an MDN already in use, or trying to update
    an MDN, both return 409.
