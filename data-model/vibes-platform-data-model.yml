    meaning: >-
      The caller's own identifier for the same object. Vibes deliberately exposes twin routes —
      /persons/{person_key} and /persons/external/{external_person_id} — so an integrator never has
      to store a Vibes key.
  - name: mdn
    meaning: >-
      Mobile Directory Number, the phone number. Functionally the natural key for a Person and
      immutable once set (attempting to change it returns 409).

