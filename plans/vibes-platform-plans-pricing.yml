specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Vibes Platform
providerId: vibes-platform
generated: '2026-08-13'
method: searched
source: https://www.vibes.com/pricing
docs: https://www.vibes.com/pricing
created: '2026-05-04'
modified: '2026-08-13'
tags:
  - Mobile Marketing
  - Mobile Messaging
  - SMS
  - MMS
  - RCS
  - Pricing
description: >-
  Vibes' published packaging, read from www.vibes.com/pricing on 2026-08-13. This replaces the
  2026-05-04 scaffold that invented a free/pro/enterprise ladder Vibes does not sell. Vibes prices
  the PLATFORM, not the API: there is no metered API price list, no per-call rate card, and no
  free or trial tier. Only one of the four packages carries a self-serve number; the rest are quotes.
plan_count: 4
currency: USD
free_tier: false
trial: false
self_serve: partial
metered_api_pricing: false
plans:
  - id: rcs-studio
    name: RCS Studio
    price: 149
    price_qualifier: starting at
    currency: USD
    period: month
    included: >-
      RCS agent provisioning, carrier approvals, compliance handling, carrier delivery, and branded
      interactive RCS flows.
    quota: not published
    overage: not published
    limits: not published
  - id: platform-professional
    name: Platform Professional
    price: 20000
    price_qualifier: starting at
    currency: USD
    period: not stated on the page (presented alongside annual packaging)
    included: >-
      All channels (SMS, MMS, RCS, Wallet, Push), unlimited seats, dedicated success manager, 24/7
      support, technical account manager access, four consulting engagements, a la carte integrations.
    quota: unlimited seats; message volume not published
    overage: >-
      "$0 per-message fees beyond carrier charges" — Vibes charges no markup per message; carrier
      pass-through applies.
    limits: not published
  - id: platform-enterprise
    name: Platform Enterprise
    price: null
    price_qualifier: Get a Quote
    currency: USD
    period: null
    included: >-
      Included integrations to existing systems, all channels, unlimited seats, dedicated success
      manager, 24/7 support, technical account manager, professional services package.
    quota: not published
    overage: $0 per-message fees beyond carrier charges
    limits: not published
  - id: vibes-connect
    name: Vibes Connect (Tier 1 Aggregation)
    price: null
    price_qualifier: Get a Quote
    currency: USD
    period: month
    billing: volume-based
    included: >-
      Direct carrier connections, geo-redundant delivery, low-code APIs, a unified hub for short
      codes / toll-free / RCS / 10DLC, and a dedicated success manager.
    quota: not published
    overage: not published
    limits: not published
notes:
  - >-
    No plan on this page is tied to an API quota. The API rate limits Vibes enforces
    (see rate-limits/vibes-platform-rate-limits.yml) are per company_key and per app_id and are the
    same on every package — pricing and throttling are decoupled here.
  - >-
    There is no free tier and no trial. The apis.yml accessModel currently reads
    "freemium / self-serve" with method: derived; the published pricing does not support that and it
    was corrected to paid / sales-assisted in this pass.
