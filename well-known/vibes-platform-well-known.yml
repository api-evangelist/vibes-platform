oauth_metadata:
  note: >-
    The Vibes RCS Business Messaging API does use OAuth 2.0 client-credentials, but its authorization
    server is an AWS Cognito user pool
    (https://vibes-rbm-prd.auth.us-west-2.amazoncognito.com/oauth2/token) rather than a Vibes host,
    and no /.well-known/oauth-authorization-server document is advertised on any vibes.com host.
    The token endpoint and scope are captured in scopes/vibes-platform-scopes.yml and
    openapi/vibes-platform-rbm-authentication-openapi.json instead.
