  docs: https://developer-platform.vibes.com/reference/versions-compatibility
  spec_version: '1.0.0'
  spec_version_note: >-
    info.version in the published OpenAPI reads 1.0.0 and is unrelated to the X-API-Version 1/2
    axis the API actually versions on — the machine-readable contract carries no signal of which
    header version it describes.

deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: 0
  note: >-
    Vibes publishes NO deprecation policy, no notice window, no Sunset or Deprecation response
    headers (RFC 8594), and marks no operation `deprecated: true` in the published OpenAPI. What it
    does publish instead is forward-compatibility GUIDANCE — bind only fields you use, follow the
    REST URLs returned in payloads rather than hard-coding them, avoid strict binding/codegen that
    throws on unknown fields, and test with unknown elements present — plus a stated intent that a
    breaking change would produce a NEW header version rather than mutate an existing one. That is
    a compatibility contract, not a deprecation contract: a consumer has no published way to learn
    that something is going away or when.
  breaking_change_mechanism: >-
    "there may be times where improvements are so extensive that the changes cannot be made forward
    compatible. In those cases, a new version of the APIs will be defined."
  source: https://developer-platform.vibes.com/reference/versions-compatibility

