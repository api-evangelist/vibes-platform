apis:
- aid: vibes-platform:vibes-platform-api
  name: Vibes Platform API
  description: >-
    The complete Vibes Platform REST API as Vibes publishes it — 48 paths and 75 operations across
    the Acquisition Campaign, Broadcast, Callback, Event, Event-Triggered Campaign, Incentive Code,
    Incentive Pool, Person, Push Device Manager, Source Code, Subscription, Subscription List,
    Wallet Campaign, Wallet Messaging, Android/iOS Wallet Template, Wallet Location Selector and
    Wallet Store Location APIs. HTTP Basic authentication, JSON only, versioned by the
    X-API-Version header, with US and EU regional hosts.
  humanURL: https://developer-platform.vibes.com/reference/our-apis
  baseURL: https://public-api.vibescm.com
  tags:
  - Mobile Messaging
  - SMS
  - MMS
  - Push Notifications
  - Wallet Passes
  - Subscription Management
