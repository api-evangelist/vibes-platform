- aid: vibes-platform:vibes-rcs-business-messaging-api
  name: Vibes RCS Business Messaging API
  description: >-
    Vibes RCS for Business (RBM) API — check a device's RCS capabilities, send RCS agent messages
    and events, revoke an undelivered message, and manage agent tester devices. Authenticated with
    OAuth 2.0 client credentials against a Vibes-operated AWS Cognito authorization server, using
    the scope https://rbm.vibes.com/rbm.agents. The only OAuth-secured surface Vibes ships.
  humanURL: https://developer-aggregation.vibes.com/reference/rcs-for-business-api
  baseURL: https://rbm.us.vibes.com/connectCustomers
  tags:
  - RCS
  - Rich Communication Services
  - Mobile Messaging
