description: >-
  Vibes is a mobile engagement platform that provides APIs for SMS messaging, push notifications, RCS for Business, and
  mobile marketing campaigns. The platform APIs support broadcast messaging, event-triggered messages, acquisition
  workflows, subscription list management, wallet pass management, and callback notifications for opt-ins and delivery
  status. Vibes operates as a Tier 1 provider with direct carrier connections in the US and Canada.
