description: >-
  Which cross-cutting industry standards and conventions the Vibes API surface actually conforms to,
  asserted only where there is published evidence. `conforms: false` here means "we looked and the
  evidence is absent", not "not applicable".
standards:
  - id: openapi
    conforms: true
    version: 3.0.0
    evidence: >-
      Vibes publishes a real OpenAPI 3.0.0 document for the Platform API (48 paths, 75 operations,
      85 component schemas), plus separate documents for the RCS Business Messaging API and its
      Cognito token endpoint. Saved verbatim in openapi/.
  - id: oauth2
    conforms: true
    profile: client_credentials
    scope: Vibes RCS Business Messaging API only
    evidence: >-
      securitySchemes.OAuth2Auth declares the clientCredentials flow against
      https://vibes-rbm-prd.auth.us-west-2.amazoncognito.com/oauth2/token with scope
      https://rbm.vibes.com/rbm.agents. The Platform API itself does NOT use OAuth.
  - id: oidc
    conforms: false
    evidence: >-
      No openIdConnect security scheme in any spec and no /.well-known/openid-configuration on any
      of the eight hosts probed (all 404). Vibes does document SSO for the platform UI, but that is
      operator login, not API auth.
  - id: rfc9457
    conforms: false
    evidence: >-
      Errors are a vendor envelope — application/json with a top-level `errors` array of
      {message, code} — not application/problem+json. See errors/vibes-platform-problem-types.yml.
  - id: rfc8594
    conforms: false
    evidence: No Deprecation or Sunset response headers are published, and no operation is marked deprecated.
  - id: idempotency
    conforms: partial
    evidence: >-
      Idempotency-Key is REQUIRED on POST /companies/{company_key}/campaigns/wallet/{token}/locations/bulk
      with published replay semantics, and declared on no other operation. Real, but 1 of 75.
  - id: pagination
    conforms: partial
    evidence: >-
      page / page_size query parameters on the wallet store-locations collection only. Every other
      collection endpoint publishes no paging contract.
  - id: rate-limiting
    conforms: partial
    evidence: >-
      Limits and the 429 status are published in prose; no RateLimit-* / X-RateLimit-* / Retry-After
      headers are documented or declared in the spec, and 429 is not declared as a response on any
      operation.
  - id: mutual-tls
    conforms: true
    evidence: >-
      Vibes documents client certificate authentication as an optional additional layer for API
      calls.
    docs: https://developer-platform.vibes.com/docs/client-certificate-authentication-for-vibes-apis
  - id: e164
    conforms: true
    evidence: >-
      X-API-Version 2 accepts and returns phone numbers in E.164 across the Acquisition Campaign,
      Person, Subscription List and Event APIs. Version 1 explicitly does not.
    docs: https://developer-platform.vibes.com/reference/versions-compatibility
  - id: json-api
    conforms: false
    evidence: Plain JSON; no JSON:API document structure, type/attributes envelope or content type.
  - id: odata
    conforms: false
    evidence: No OData query surface.
  - id: scim
    conforms: false
    evidence: >-
      Person and subscription management is a proprietary model (person_key / external_person_id /
      MDN), not SCIM.
  - id: fhir
    conforms: false
    evidence: Not a healthcare API.
  - id: fapi
    conforms: false
    evidence: Not a financial-grade API.
  - id: psd2
    conforms: false
    evidence: Not a payments API.
  - id: asyncapi
    conforms: false
    evidence: >-
      No AsyncAPI document, despite a substantial documented webhook surface (20 callback event
      types). See asyncapi/vibes-platform-webhooks.yml.
  - id: mcp
    conforms: false
    evidence: No MCP server published; no /.well-known/mcp.json on any host (all 404 or SPA/SOAP catch-all).
  - id: a2a
    conforms: false
    evidence: >-
      No agent card at /.well-known/agent-card.json or the legacy /.well-known/agent.json on any of
      the eight hosts probed.
  - id: llms-txt
    conforms: true
    evidence: >-
      Both developer portals serve a real llms.txt (developer-platform.vibes.com, 19,497 bytes;
      developer-aggregation.vibes.com, 5,753 bytes) and every documentation page has a .md twin.
      This is the strongest agent-readiness signal on the estate.

