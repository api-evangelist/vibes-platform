naftiko: 1.0.0-alpha2
info:
  label: Vibes Connect HTTP Message API — Messages
  description: 'Vibes Connect HTTP Message API — Messages. 2 operations. Lead operation: Send MMS Message. Self-contained
    Naftiko capability covering one Vibes Platform business surface.'
  tags:
  - Vibes Platform
  - Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VIBES_PLATFORM_API_KEY: VIBES_PLATFORM_API_KEY
capability:
  consumes:
  - type: http
    namespace: vibes-connect-messages
    baseUri: https://messageapi.vibesapps.com
    description: Vibes Connect HTTP Message API — Messages business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-mms-messages
      path: /api/v1/mms/messages
      operations:
      - name: sendmmsmessage
        method: POST
        description: Send MMS Message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v1-sms-messages
      path: /api/v1/sms/messages
      operations:
      - name: sendsmsmessage
        method: POST
        description: Send SMS Message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.VIBES_PLATFORM_USER}}'
      password: '{{env.VIBES_PLATFORM_PASS}}'
  exposes:
  - type: rest
    namespace: vibes-connect-messages-rest
    port: 8080
    description: REST adapter for Vibes Connect HTTP Message API — Messages. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/v1/mms/messages
      name: api-v1-mms-messages
      description: REST surface for api-v1-mms-messages.
      operations:
      - method: POST
        name: sendmmsmessage
        description: Send MMS Message
        call: vibes-connect-messages.sendmmsmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/sms/messages
      name: api-v1-sms-messages
      description: REST surface for api-v1-sms-messages.
      operations:
      - method: POST
        name: sendsmsmessage
        description: Send SMS Message
        call: vibes-connect-messages.sendsmsmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: vibes-connect-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Vibes Connect HTTP Message API — Messages. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: send-mms-message
      description: Send MMS Message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: vibes-connect-messages.sendmmsmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: send-sms-message
      description: Send SMS Message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: vibes-connect-messages.sendsmsmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
