naftiko: 1.0.0-alpha2
info:
  label: Vibes Connect HTTP Message API — Carrier Lookup
  description: 'Vibes Connect HTTP Message API — Carrier Lookup. 1 operations. Lead operation: Lookup Carrier. Self-contained
    Naftiko capability covering one Vibes Platform business surface.'
  tags:
  - Vibes Platform
  - Carrier Lookup
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VIBES_PLATFORM_API_KEY: VIBES_PLATFORM_API_KEY
capability:
  consumes:
  - type: http
    namespace: vibes-connect-carrier-lookup
    baseUri: https://messageapi.vibesapps.com
    description: Vibes Connect HTTP Message API — Carrier Lookup business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-carrier-lookup
      path: /api/v1/carrier-lookup
      operations:
      - name: lookupcarrier
        method: POST
        description: Lookup Carrier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.VIBES_PLATFORM_USER}}'
      password: '{{env.VIBES_PLATFORM_PASS}}'
  exposes:
  - type: rest
    namespace: vibes-connect-carrier-lookup-rest
    port: 8080
    description: REST adapter for Vibes Connect HTTP Message API — Carrier Lookup. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/v1/carrier-lookup
      name: api-v1-carrier-lookup
      description: REST surface for api-v1-carrier-lookup.
      operations:
      - method: POST
        name: lookupcarrier
        description: Lookup Carrier
        call: vibes-connect-carrier-lookup.lookupcarrier
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: vibes-connect-carrier-lookup-mcp
    port: 9090
    transport: http
    description: MCP adapter for Vibes Connect HTTP Message API — Carrier Lookup. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: lookup-carrier
      description: Lookup Carrier
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: vibes-connect-carrier-lookup.lookupcarrier
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
