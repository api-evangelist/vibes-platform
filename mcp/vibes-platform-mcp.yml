inputschema_note: >-
  Tools are addressed by METHOD + path because the published Vibes OpenAPI declares NO operationId
  on any of its 75 operations. Any real MCP server built from this spec would have to invent tool
  names, which is exactly the coupling problem operationIds exist to prevent.
agent_readiness_note: >-
  Six of the candidate tools have PHYSICAL consequence — they put a message on a real handset and
  cannot be undone. Only one operation in the whole API accepts an Idempotency-Key, and it is not
  one of these six. Any agent deployment would need human-in-the-loop on send.
