- target: $.paths.*.*.responses
  description: Declare the 429 Too Many Requests response Vibes documents on its Technical Details page
    but omits from every operation in the published spec.
  update:
    '429':
      description: 'Too Many Requests. The per-second throttle was exceeded (300/s inbound events, 100/s
        other calls per company_key, 100/s per app_id, 20/s Google Wallet updates). No Retry-After or
        rate-limit headers are returned; back off on a client-chosen schedule. Source: https://developer-platform.vibes.com/reference/technical-details'
